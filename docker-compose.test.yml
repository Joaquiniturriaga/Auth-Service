services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"        
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - ./src/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  auth-test:
    build:
      context: .
      target: test            
    environment:
      NODE_ENV: test
      JWT_SECRET: test-secret-local
      RESEND_API_KEY: test-fake-key
      DATABASE_URL: postgresql://testuser:testpass@db-test:5432/testdb?sslmode=disable
    depends_on:
      db-test:
        condition: service_healthy   
